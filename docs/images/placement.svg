  <text x="680" y="398" text-anchor="middle" fill="#556">Right side is the mirror image: Bias behind the right ear.</text>
  <text x="680" y="416" text-anchor="middle" fill="#556">Skin, not hair. Wipe with alcohol, let it dry, press 5 s.</text>
