<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1000" height="560" fill="#f6f7f9"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#1b2a3a">What's in the box</text>

  <!-- 1 Raspberry Pi -->
  <g transform="translate(40,70)">
    <rect width="250" height="165" rx="10" fill="#4c9a5c" stroke="#2e5f39" stroke-width="2"/>
    <g fill="#c9a227"><rect x="226" y="12" width="14" height="140"/></g>
    <g fill="#1d1d1d"><rect x="228" y="16" width="4" height="132" opacity="0.35"/></g>
    <rect x="90" y="55" width="55" height="55" fill="#1d1d1d"/>
    <rect x="-12" y="22" width="30" height="20" fill="#b7bcc2" stroke="#666"/>
    <rect x="-8" y="70" width="34" height="26" fill="#b7bcc2" stroke="#666"/>
    <rect x="160" y="120" width="44" height="45" fill="#b7bcc2" stroke="#666"/>
    <rect x="100" y="120" width="44" height="45" fill="#b7bcc2" stroke="#666"/>
    <text x="0" y="195" font-weight="bold" fill="#1b2a3a">① Raspberry Pi 3 Model B</text>
    <text x="0" y="214" fill="#556" font-size="13">computer · 40 pin header · WiFi</text>
    <text x="0" y="232" fill="#556" font-size="13">MicroSD with PiEEG Server inside</text>
  </g>

  <!-- 2 PiEEG -->
  <g transform="translate(370,70)">
    <rect width="250" height="165" rx="10" fill="#f2b84b" stroke="#a87b1f" stroke-width="2"/>
    <rect x="95" y="55" width="50" height="50" fill="#1d1d1d"/>
    <text x="120" y="125" text-anchor="middle" font-size="11" fill="#5a4310">ADS1299</text>
    <g fill="#c9a227" stroke="#7a5b12">
      <rect x="18" y="20" width="10" height="10"/><rect x="18" y="33" width="10" height="10"/>
      <rect x="18" y="46" width="10" height="10"/><rect x="18" y="59" width="10" height="10"/>
      <rect x="18" y="72" width="10" height="10"/><rect x="18" y="85" width="10" height="10"/>
      <rect x="18" y="98" width="10" height="10"/><rect x="18" y="111" width="10" height="10"/>
      <rect x="18" y="124" width="10" height="10"/><rect x="18" y="137" width="10" height="10"/>
    </g>
    <text x="34" y="29" font-size="9" fill="#5a4310">Ref</text>
    <text x="34" y="146" font-size="9" fill="#5a4310">E1</text>
    <text x="0" y="195" font-weight="bold" fill="#1b2a3a">② PiEEG-8 board</text>
    <text x="0" y="214" fill="#556" font-size="13">EEG amplifier · 8 channels + Ref + Bias</text>
    <text x="0" y="232" fill="#556" font-size="13">10 male pins on the left edge</text>
  </g>

  <!-- 3 electrodes -->
  <g transform="translate(700,70)">
    <circle cx="45" cy="45" r="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#dfe6ee"/>
    <circle cx="45" cy="45" r="11" fill="#b7bcc2" stroke="#666"/><circle cx="45" cy="45" r="4" fill="#888"/>
    <circle cx="130" cy="45" r="40" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/>
    <circle cx="130" cy="45" r="22" fill="#dfe6ee"/>
    <circle cx="130" cy="45" r="11" fill="#b7bcc2" stroke="#666"/><circle cx="130" cy="45" r="4" fill="#888"/>
    <text x="210" y="50" font-size="22" fill="#556">× 60</text>
    <text x="0" y="125" font-weight="bold" fill="#1b2a3a">③ Electrode stickers</text>
    <text x="0" y="144" fill="#556" font-size="13">Ag/AgCl · foam · 2.6 cm</text>
    <text x="0" y="162" fill="#556" font-size="13">metal snap in the middle · single use</text>
  </g>

  <!-- 4 cables -->
  <g transform="translate(40,330)">
    <rect x="0" y="20" width="16" height="22" fill="#222"/>
    <path d="M16 31 C 90 31, 130 60, 210 60" stroke="#c0392b" stroke-width="5" fill="none"/>
    <path d="M210 52 l40 -10 l4 6 l-40 12 z M210 68 l40 10 l4 -6 l-40 -12 z" fill="#9aa1a8" stroke="#555"/>
    <rect x="0" y="62" width="16" height="22" fill="#222"/>
    <path d="M16 73 C 90 73, 130 100, 210 100" stroke="#2f6fb0" stroke-width="5" fill="none"/>
    <path d="M210 92 l40 -10 l4 6 l-40 12 z M210 108 l40 10 l4 -6 l-40 -12 z" fill="#9aa1a8" stroke="#555"/>
    <text x="275" y="80" font-size="22" fill="#556">× 10</text>
    <text x="0" y="145" font-weight="bold" fill="#1b2a3a">④ Dupont to alligator clip cables</text>
    <text x="0" y="164" fill="#556" font-size="13">black female end → board pin · clip → sticker snap · 20 cm</text>
  </g>

  <!-- 5 power -->
  <g transform="translate(520,330)">
    <rect x="0" y="20" width="150" height="80" rx="14" fill="#3d4a5c" stroke="#222" stroke-width="2"/>
    <rect x="148" y="48" width="12" height="18" fill="#b7bcc2" stroke="#555"/>
    <path d="M160 57 C 210 57, 220 100, 270 100" stroke="#c0392b" stroke-width="5" fill="none"/>
    <rect x="270" y="93" width="22" height="14" fill="#b7bcc2" stroke="#555"/>
    <text x="75" y="66" text-anchor="middle" fill="#fff">Powerbank</text>
    <text x="0" y="145" font-weight="bold" fill="#1b2a3a">⑤ Powerbank + Micro USB cable</text>
    <text x="0" y="164" fill="#556" font-size="13">USB A port with 2.4 A or more → PWR IN on the Pi</text>
  </g>

  <text x="30" y="540" fill="#778" font-size="12">Plus: alcohol wipes, and your MacBook on battery. Drawings are schematic, not to scale.</text>
</svg>
